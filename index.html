<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA - Login Firebase</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#007bff">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <h1 class="logo">Login</h1>
        
        <div id="login-section" class="auth-box">
            <h2>Login</h2>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="E-mail" required>
                <input type="password" id="login-password" placeholder="Senha" required>
                <button type="submit" class="btn primary">Entrar</button>
            </form>
            <p class="switch-text">
                     <a href="#" id="show-register">Crie uma conta</a>
            </p>
        </div>

        <div id="register-section" class="auth-box hidden">
            <h2>Criar Conta</h2>
            <form id="register-form">
                <input type="email" id="register-email" placeholder="E-mail" required>
                <input type="password" id="register-password" placeholder="Senha (mínimo 6 caracteres)" required minlength="6">
                <button type="submit" class="btn success">Registrar</button>
            </form>
            <p class="switch-text">
                Já tem conta? <a href="#" id="show-login">Fazer Login</a>
            </p>
        </div>

        <div id="auth-message" class="message-area hidden"></div>
    </main>

    <script type="module" src="scripts/main.js"></script> 
</body>
</html>
